<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EXCON 2025 | 3D Helix Gallery</title>
    <style>
        :root {
            --primary: #00f2ff;
            --bg: #00050a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg);
            color: white;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* The viewport for 3D */
        .scene {
            perspective: 1500px;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #001a33 0%, #000 70%);
        }

        /* The rotating helix container */
        .helix {
            position: relative;
            width: 300px;
            height: 200px;
            transform-style: preserve-3d;
            animation: rotateHelix 40s linear infinite;
        }

        /* .helix:hover {
            animation-play-state: paused;
        } */

        /* Media Card Styling */
        .card {
            position: absolute;
            left: 0;
            top: 0;
            width: 250px;
            height: 150px;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(0, 242, 255, 0.3);
            backface-visibility: visible;
            transition: all 0.5s ease;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.2);
        }

        /* .card:hover {
            border: 2px solid var(--primary);
            box-shadow: 0 0 40px var(--primary);
            transform: scale(1.2) !important;
            z-index: 1000 !important;
        } */

        .card img, .card video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Center Branding */
        .center-text {
            position: absolute;
            z-index: 5000;
            pointer-events: none;
            text-align: center;
            text-shadow: 0 0 20px var(--primary);
        }

        .center-text h1 {
            font-size: 5vw;
            letter-spacing: 10px;
            font-weight: 900;
            color: #fff;
        }

        @keyframes rotateHelix {
            from { transform: rotateY(0deg); }
            to { transform: rotateY(360deg); }
        }

        /* Video Play Icon Overlay */
        .video-icon {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.6);
            border-radius: 50%;
            padding: 5px;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div class="center-text">
        <h1>EXCON <span style="color: var(--primary)">2025</span></h1>
        <p style="letter-spacing: 5px; opacity: 0.7;">DIGITAL ARCHIVE</p>
    </div>

    <div class="scene">
        <div class="helix" id="helix">
            </div>
    </div>

    <script>
        const helix = document.getElementById('helix');
        const cardCount = 60; // Total number of photos/videos
        const radius = 600; // Radius of the circle
        const heightGap = 40; // Vertical distance between cards

        // Sample Data: Mixture of random photos and a placeholder video
        const media = [
            { type: 'image', url: 'https://picsum.photos/400/300?random=1' },
            { type: 'image', url: 'https://picsum.photos/400/300?random=2' },
            { type: 'image', url: 'https://picsum.photos/400/300?random=3' },
            { type: 'video', url: 'https://assets.mixkit.co/videos/preview/mixkit-tech-animation-of-circuits-and-data-22444-large.mp4' }
        ];

        for (let i = 0; i < cardCount; i++) {
            const item = media[i % media.length];
            const card = document.createElement('div');
            card.className = 'card';

            // Calculate rotation and Y position for Helix shape
            const angle = (i * 25); // Degree of rotation for each card
            const yOffset = (i - cardCount / 2) * heightGap; // Stack vertically

            // Apply 3D Transform
            card.style.transform = `rotateY(${angle}deg) translateZ(${radius}px) translateY(${yOffset}px)`;

            if (item.type === 'image') {
                card.innerHTML = `<img src="${item.url}" alt="Gallery">`;
            } else {
                card.innerHTML = `
                    <div class="video-icon">▶</div>
                    <video src="${item.url}" muted loop playsinline onmouseover="this.play()" onmouseout="this.pause()"></video>
                `;
            }

            helix.appendChild(card);
        }

        // Add Mouse Interaction for Tilt
        document.addEventListener('mousemove', (e) => {
            const x = (window.innerWidth / 2 - e.pageX) / 20;
            const y = (window.innerHeight / 2 - e.pageY) / 20;
            helix.style.transform = `rotateX(${y}deg) rotateY(${x}deg)`;
            // Note: This overrides the animation temporarily. For a permanent tilt, wrap helix in another div.
        });
    </script>
</body>
</html>
