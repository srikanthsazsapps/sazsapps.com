<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excon 2023 - Shuffling Stack</title>
    <style>
        /* 1. Global Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background-color: #000;
            overflow: hidden;
        }

        /* 2. Hero Section & Video */
        .hero-section {
            position: relative;
            height: 100vh;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .video-bg {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: -2;
        }

        .video-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, rgba(0,0,0,0.9) 20%, rgba(0,0,0,0.4) 100%);
            z-index: -1;
        }

        .container {
            width: 85%;
            max-width: 1200px;
            display: flex;
            align-items: center;
        }

        .content-left { flex: 1.2; }
        h1 { font-size: 3.5rem; margin-bottom: 20px; }
        .blue-text { color: #2563EB; }

        /* 3. The Shuffling Stack Logic */
        .content-right {
            flex: 0.8;
            position: relative;
            height: 450px;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1000px;
        }

        .image-card {
            position: absolute;
            width: 520px;
            height: 350px;
            border-radius: 20px;
            border: 3px solid rgba(255,255,255,0.8);
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            
            /* Smooth movement transition */
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }

        .image-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* CARD POSITIONS */
        
        /* The one in the very front */
        .active-front {
            z-index: 10;
            transform: translateZ(50px) translateY(0) scale(1) rotate(0deg);
            opacity: 1;
            border-color: #2563EB;
        }

        /* The ones waiting in the back */
        .back-pile {
            z-index: 1;
            transform: translateZ(-100px) translateY(20px) scale(0.8) rotate(var(--r));
            opacity: 0.5;
        }

        /* Transition state: flying out to move to back */
        .exit-top {
            z-index: 11;
            transform: translateZ(150px) translateY(-150%) scale(1.1) rotate(10deg);
            opacity: 0;
        }

        @media (max-width: 900px) {
            .container { flex-direction: column; text-align: center; }
            .content-right { height: 350px; margin-top: 40px; }
            .image-card { width: 180px; height: 250px; }
        }
    </style>
</head>
<body>

    <section class="hero-section">
        <video autoplay muted loop playsinline class="video-bg">
            <source src="/excon2003.mp4" type="video/mp4">
        </video>
        <div class="video-overlay"></div>

        <div class="container">
            <div class="content-left">
                <p style="color: #FF9F00; font-weight: bold; letter-spacing: 2px;">BENGALURU • 2023</p>
                <h1>EXCON 2023: <br><span class="blue-text">Bricks Software</span></h1>
                <p style="color: #ccc; max-width: 450px;">Watch our latest images from the event shuffle into focus.</p>
            </div>

            <div class="content-right" id="stack-container">
                <div class="image-card" style="--r: -10deg;"><img src="https://picsum.photos/400/600?random=1"></div>
                <div class="image-card" style="--r: 5deg;"><img src="https://picsum.photos/400/600?random=2"></div>
                <div class="image-card" style="--r: -5deg;"><img src="https://picsum.photos/400/600?random=3"></div>
                <div class="image-card" style="--r: 8deg;"><img src="https://picsum.photos/400/600?random=4"></div>
                <div class="image-card" style="--r: 0deg;"><img src="https://picsum.photos/400/600?random=5"></div>
            </div>
        </div>
    </section>

    <script>
        const cards = Array.from(document.querySelectorAll('.image-card'));
        let currentIndex = 0;

        function updateStack() {
            cards.forEach((card, index) => {
                // Clear all classes
                card.classList.remove('active-front', 'back-pile', 'exit-top');

                if (index === currentIndex) {
                    // Current image comes to front
                    card.classList.add('active-front');
                } else {
                    // Others stay in the back pile
                    card.classList.add('back-pile');
                }
            });
        }

        function shuffle() {
            const currentCard = cards[currentIndex];
            
            // 1. Move the current front card out (Exit animation)
            currentCard.classList.add('exit-top');

            // 2. Wait for exit animation, then change index and update
            setTimeout(() => {
                currentIndex = (currentIndex + 1) % cards.length;
                updateStack();
            }, 600); // This matches transition time
        }

        // Initialize positions
        updateStack();

        // Run the shuffle every 3 seconds
        setInterval(shuffle, 3000);
    </script>
</body>
</html>
