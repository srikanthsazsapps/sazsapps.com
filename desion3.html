<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EXCON 2025 - Ultra Big 3D Wall</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .world {
            perspective: 1200px;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 60px; /* Wider gap for bigger cards */
            background: radial-gradient(circle, #1a1a1a 0%, #000 100%);
            overflow: hidden;
        }

        /* VIGNETTE OVERLAYS: Makes the top and bottom fade into black */
        .world::before, .world::after {
            content: '';
            position: absolute;
            left: 0; width: 100%; height: 20vh;
            z-index: 100;
            pointer-events: none;
        }
        .world::before { top: 0; background: linear-gradient(to bottom, #000, transparent); }
        .world::after { bottom: 0; background: linear-gradient(to top, #000, transparent); }

        .column {
            display: flex;
            flex-direction: column;
            gap: 30px;
            width: 450px; /* BIGGER WIDTH */
        }

        .left-col { 
            transform: rotateY(20deg); 
            animation: scrollUp 20s linear infinite;
        }
        
        .center-col { 
            transform: translateZ(150px); 
            animation: scrollDown 18s linear infinite;
            z-index: 10;
        }
        
        .right-col { 
            transform: rotateY(-20deg); 
            animation: scrollUp 22s linear infinite;
        }

        .card {
            width: 100%;
            height: 300px; /* MUCH BIGGER HEIGHT */
            border-radius: 25px;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.2);
            /* REMOVED GRAYSCALE AND DARKNESS */
            filter: brightness(1) contrast(1.1); 
            transition: all 0.5s cubic-bezier(0.2, 1, 0.3, 1);
            cursor: pointer;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            flex-shrink: 0;
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }

        /* HOVER EFFECT: Zooms even bigger */
        .card:hover {
            transform: scale(1.1) translateZ(200px);
            z-index: 1000;
            border: 4px solid #2563EB;
            box-shadow: 0 0 60px rgba(37, 99, 235, 0.6);
        }

        @keyframes scrollUp {
            0% { transform: rotateY(var(--rot, 0deg)) translateY(0); }
            100% { transform: rotateY(var(--rot, 0deg)) translateY(calc(-50% - 15px)); }
        }

        @keyframes scrollDown {
            0% { transform: translateZ(150px) translateY(calc(-50% - 15px)); }
            100% { transform: translateZ(150px) translateY(0); }
        }

        .content-overlay {
            position: absolute;
            z-index: 500;
            pointer-events: none;
            text-align: center;
            color: white;
            width: 100%;
        }

        .content-overlay h1 {
            font-size: 8vw;
            text-shadow: 0 0 40px rgba(0,0,0,1);
            letter-spacing: 20px;
            font-weight: 900;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="content-overlay">
        <h1>EXCON <span style="color:#2563EB">2025</span></h1>
    </div>

    <div class="world">
        <div class="column left-col" style="--rot: 20deg;">
            <div class="card"><img src="https://picsum.photos/600/800?random=11"></div>
            <div class="card"><img src="https://picsum.photos/600/800?random=12"></div>
            <div class="card"><img src="https://picsum.photos/600/800?random=13"></div>
            <div class="card"><img src="https://picsum.photos/600/800?random=11"></div>
            <div class="card"><img src="https://picsum.photos/600/800?random=12"></div>
            <div class="card"><img src="https://picsum.photos/600/800?random=13"></div>
        </div>

        <div class="column center-col">
            <div class="card"><img src="https://picsum.photos/600/800?random=14"></div>
            <div class="card"><img src="https://picsum.photos/600/800?random=15"></div>
            <div class="card"><img src="https://picsum.photos/600/800?random=16"></div>
            <div class="card"><img src="https://picsum.photos/600/800?random=14"></div>
            <div class="card"><img src="https://picsum.photos/600/800?random=15"></div>
            <div class="card"><img src="https://picsum.photos/600/800?random=16"></div>
        </div>

        <div class="column right-col" style="--rot: -20deg;">
            <div class="card"><img src="https://picsum.photos/600/800?random=17"></div>
            <div class="card"><img src="https://picsum.photos/600/800?random=18"></div>
            <div class="card"><img src="https://picsum.photos/600/800?random=19"></div>
            <div class="card"><img src="https://picsum.photos/600/800?random=17"></div>
            <div class="card"><img src="https://picsum.photos/600/800?random=18"></div>
            <div class="card"><img src="https://picsum.photos/600/800?random=19"></div>
        </div>
    </div>

</body>
</html>
