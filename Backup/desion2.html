<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triple Scroll Gallery</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            overflow: hidden; /* Keeps everything inside the section */
            font-family: 'Segoe UI', sans-serif;
        }

        .hero-gallery {
            position: relative;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            background: #050505;
            padding: 20px;
        }

        /* The Columns */
        .scroll-column {
            flex: 1;
            height: 140%; /* Taller than screen to allow smooth scroll */
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Animation Directions */
        .up { animation: scrollUp 20s linear infinite; }
        .down { animation: scrollDown 20s linear infinite; }

        .media-card {
            width: 100%;
            height: 300px;
            border-radius: 20px;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.1);
            position: relative;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            z-index: 1;
        }

        .media-card img, .media-card video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* POPUP BIG ON HOVER */
        .media-card:hover {
            transform: scale(1.2);
            z-index: 100;
            border: 3px solid #1a73e8;
            box-shadow: 0 20px 40px rgba(0,0,0,1);
        }

        /* Pause all columns on hover */
        .hero-gallery:hover .scroll-column {
            animation-play-state: paused;
        }

        /* Scrolling Keyframes */
        @keyframes scrollUp {
            0% { transform: translateY(0); }
            100% { transform: translateY(-50%); }
        }

        @keyframes scrollDown {
            0% { transform: translateY(-50%); }
            100% { transform: translateY(0); }
        }

        /* Background Text Overlay to match your image style */
        .overlay-text {
            position: absolute;
            pointer-events: none;
            z-index: 200;
            text-align: center;
            color: white;
            text-shadow: 0 0 20px rgba(0,0,0,1);
        }

        h1 { font-size: 4rem; text-transform: uppercase; }
        .blue { color: #1a73e8; }
    </style>
</head>
<body>

    <section class="hero-gallery">
        
        <div class="overlay-text">
            <h1>EXCON <span class="blue">2023</span></h1>
            <p>SOFTWARE LAUNCH EVENT</p>
        </div>

        <div class="scroll-column down">
            <div class="media-card"><img src="https://picsum.photos/400/600?random=1"></div>
            <div class="media-card"><video src="v1.mp4" autoplay muted loop playsinline></video></div>
            <div class="media-card"><img src="https://picsum.photos/400/600?random=2"></div>
            <div class="media-card"><img src="https://picsum.photos/400/600?random=3"></div>
            <div class="media-card"><video src="v2.mp4" autoplay muted loop playsinline></video></div>
            <div class="media-card"><img src="https://picsum.photos/400/600?random=1"></div>
            <div class="media-card"><video src="v1.mp4" autoplay muted loop playsinline></video></div>
            <div class="media-card"><img src="https://picsum.photos/400/600?random=2"></div>
        </div>

        <div class="scroll-column up">
            <div class="media-card"><video src="v3.mp4" autoplay muted loop playsinline></video></div>
            <div class="media-card"><img src="https://picsum.photos/400/600?random=4"></div>
            <div class="media-card"><video src="v4.mp4" autoplay muted loop playsinline></video></div>
            <div class="media-card"><img src="https://picsum.photos/400/600?random=5"></div>
            <div class="media-card"><img src="https://picsum.photos/400/600?random=6"></div>
            <div class="media-card"><video src="v3.mp4" autoplay muted loop playsinline></video></div>
            <div class="media-card"><img src="https://picsum.photos/400/600?random=4"></div>
            <div class="media-card"><video src="v4.mp4" autoplay muted loop playsinline></video></div>
        </div>

        <div class="scroll-column down">
            <div class="media-card"><img src="https://picsum.photos/400/600?random=7"></div>
            <div class="media-card"><video src="v5.mp4" autoplay muted loop playsinline></video></div>
            <div class="media-card"><img src="https://picsum.photos/400/600?random=8"></div>
            <div class="media-card"><video src="v6.mp4" autoplay muted loop playsinline></video></div>
            <div class="media-card"><img src="https://picsum.photos/400/600?random=9"></div>
            <div class="media-card"><img src="https://picsum.photos/400/600?random=7"></div>
            <div class="media-card"><video src="v5.mp4" autoplay muted loop playsinline></video></div>
            <div class="media-card"><img src="https://picsum.photos/400/600?random=8"></div>
        </div>

    </section>

</body>
</html>
