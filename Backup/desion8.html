<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAZS | Leather Diary 2025</title>
    <style>
        :root {
            --leather: #3d2616;
            --paper: #f4ecd8;
            --ink: #4b3621;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background: #120d0a;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden; font-family: 'Georgia', serif;
        }

        /* The 3D Book Container */
        .book {
            position: relative;
            width: 800px;
            height: 550px;
            perspective: 2000px;
        }

        /* Leather Cover (The base) */
        .cover {
            position: absolute;
            width: 100%; height: 100%;
            background: var(--leather);
            border-radius: 8px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.7);
            display: flex;
        }

        .cover-left {
            flex: 1;
            border-right: 2px solid rgba(0,0,0,0.3);
            padding: 40px;
            color: #d4c5a1;
        }

        /* The Flipping Pages */
        .page {
            position: absolute;
            width: 390px;
            height: 520px;
            top: 15px;
            right: 15px;
            transform-origin: left center;
            transform-style: preserve-3d;
            transition: transform 1.2s cubic-bezier(0.645, 0.045, 0.355, 1);
            cursor: pointer;
            z-index: 1;
        }

        .front, .back {
            position: absolute;
            width: 100%; height: 100%;
            padding: 25px;
            box-sizing: border-box;
            background: var(--paper);
            border: 1px solid #d4c5a1;
            backface-visibility: hidden;
            box-shadow: inset 3px 0px 20px rgba(0,0,0,0.1);
        }

        .back {
            transform: rotateY(180deg);
            background: #e9e0c9;
        }

        /* Content inside the pages */
        .media-box {
            width: 100%;
            height: 220px;
            background: #000;
            margin-bottom: 15px;
            border: 6px solid #fff;
            box-shadow: 2px 5px 15px rgba(0,0,0,0.2);
        }

        .media-box img, .media-box video {
            width: 100%; height: 100%;
            object-fit: cover;
        }

        .text-content {
            font-size: 15px;
            color: var(--ink);
            line-height: 1.5;
            border-top: 1px solid rgba(0,0,0,0.1);
            padding-top: 10px;
        }

        /* Page Turn Logic */
        .flipped {
            transform: rotateY(-180deg);
            z-index: 2;
        }

        /* Mobile Responsive */
        @media (max-width: 850px) {
            .book { width: 95vw; height: 70vh; }
            .cover-left { display: none; }
            .page { width: 100%; right: 0; }
        }
    </style>
</head>
<body>

    <div class="book">
        <div class="cover">
            <div class="cover-left">
                <h1 style="border-bottom: 2px solid #d4c5a1;">SAZS</h1>
                <p style="letter-spacing: 2px;">EVENT DIARY</p>
                <div style="margin-top: 200px; opacity: 0.6;">
                    <p>EXCON 2025</p>
                    <p>Click pages to flip →</p>
                </div>
            </div>
        </div>

        <div id="pagesContainer"></div>
    </div>

    <script>
        const container = document.getElementById('pagesContainer');

        // Paths for 10 videos and 20 images
        const videoList = [
            "./src/assets/contentVideos/vid1.mp4", "./src/assets/contentVideos/vid2.mp4",
            "./src/assets/contentVideos/vid3.mp4", "./src/assets/contentVideos/vid4.mp4",
            "./src/assets/contentVideos/vid5.mp4", "./src/assets/contentVideos/vid6.mp4",
            "./src/assets/contentVideos/vid7.mp4", "./src/assets/contentVideos/vid8.mp4",
            "./src/assets/contentVideos/vid9.mp4", "./src/assets/contentVideos/vid10.mp4"
        ];

        const imageList = [
            "./src/assets/contentImages/whyimg2.webp", "./src/assets/contentImages/sazsLogo1.png",
            "./src/assets/contentImages/img5.jpg", "./src/assets/contentImages/img6.jpg",
            "./src/assets/contentImages/img7.jpg", "./src/assets/contentImages/img8.jpg",
            "./src/assets/contentImages/img9.jpg", "./src/assets/contentImages/img10.jpg",
            "./src/assets/contentImages/img11.jpg", "./src/assets/contentImages/img12.jpg",
            "./src/assets/contentImages/img13.jpg", "./src/assets/contentImages/img14.jpg",
            "./src/assets/contentImages/img15.jpg", "./src/assets/contentImages/img16.jpg",
            "./src/assets/contentImages/img17.jpg", "./src/assets/contentImages/img18.jpg",
            "./src/assets/contentImages/img19.jpg", "./src/assets/contentImages/img20.jpg",
            "./src/assets/contentImages/img21.jpg", "./src/assets/contentImages/img22.jpg"
        ];

        // Combine into pairs for front/back pages
        const allMedia = [...videoList.map(v => ({src: v, type: 'v'})), ...imageList.map(i => ({src: i, type: 'i'}))];

        function buildBook() {
            for (let i = 0; i < 15; i++) {
                const page = document.createElement('div');
                page.className = 'page';
                page.style.zIndex = 15 - i;

                const frontItem = allMedia[i * 2];
                const backItem = allMedia[i * 2 + 1];

                page.innerHTML = `
                    <div class="front">
                        <div class="media-box">
                            ${frontItem.type === 'v' ? `<video src="${frontItem.src}" muted loop autoplay></video>` : `<img src="${frontItem.src}">`}
                        </div>
                        <div class="text-content">
                            <b>Memory Log #${i*2 + 1}</b><br>
                            Insights from the EXCON 2025 industrial exhibition.
                        </div>
                    </div>
                    <div class="back">
                        <div class="media-box">
                            ${backItem.type === 'v' ? `<video src="${backItem.src}" muted loop autoplay></video>` : `<img src="${backItem.src}">`}
                        </div>
                        <div class="text-content">
                            <b>Memory Log #${i*2 + 2}</b><br>
                            Technological advancements in quarry and crusher operations.
                        </div>
                    </div>
                `;

                page.onclick = function() {
                    this.classList.toggle('flipped');
                };

                container.appendChild(page);
            }
        }

        buildBook();
    </script>
</body>
</html>
