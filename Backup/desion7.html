<div class="media-wall-section">
    <style>
        /* Scope ALL styles to media-wall-section only */
        .media-wall-section {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            background: #1a120b;
            overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
            touch-action: none;
            position: relative;
        }

        .media-wall-section .table {
            position: relative;
            width: 100%;
            height: 100%;
            background-image: url('https://www.transparenttextures.com/patterns/dark-wood.png');
        }

        /* Default Desktop Size */
        .media-wall-section .photo-brick {
            position: absolute;
            width: 320px;
            height: 250px;
            background: #fff;
            padding: 10px 10px 45px 10px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            cursor: grab;
            user-select: none;
            transition: transform 0.2s ease, box-shadow 0.2s;
            border-radius: 2px;
        }

        /* MOBILE ADJUSTMENTS */
        @media (max-width: 600px) {
            .media-wall-section .photo-brick {
                width: 140px;
                height: 160px;
                padding: 5px 5px 25px 5px;
            }
            
            .media-wall-section .photo-brick.active {
                width: 95vw !important;
                height: 60vh !important;
                padding: 10px !important;
            }

            .media-wall-section button {
                padding: 8px 15px !important;
                font-size: 12px;
            }
        }

        .media-wall-section .photo-brick:active {
            cursor: grabbing;
            z-index: 1000 !important;
        }

        .media-wall-section .photo-brick img,
        .media-wall-section .photo-brick video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
            background: #000;
        }

        /* BIG SCREEN MODE */
        .media-wall-section .photo-brick.active {
            position: fixed !important;
            top: 50% !important;
            left: 50% !important;
            width: 85vw;
            height: 80vh;
            transform: translate(-50%, -50%) rotate(0deg) !important;
            z-index: 9999 !important;
            padding: 20px;
            cursor: default;
        }

        .media-wall-section .controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 10000;
        }

        .media-wall-section button {
            padding: 10px 20px;
            background: #fff;
            border: none;
            cursor: pointer;
            font-weight: bold;
            border-radius: 5px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
    </style>

    <div class="controls">
        <button onclick="shuffleWall()">SHUFFLE TABLE</button>
    </div>

    <div id="table" class="table"></div>

    <script>
        const table = document.getElementById('table');
        let highestZ = 100;

        const videoList = [
            "../src/assets/imageevent/event5/sazs app team video.mp4", "../src/assets/imageevent/event5/sazs product reel2.mp4",
            "../src/assets/imageevent/event5/sazs Reel6 out.mp4", "../src/assets/imageevent/event5/sazsappcustomerinteraction.mp4",
            "../src/assets/imageevent/event5/sazsproductreel1.mp4", "../src/assets/imageevent/event5/sazsthankyoureel.mp4",
            // "./src/assets/contentVideos/vid7.mp4", "./src/assets/contentVideos/vid8.mp4",
            // "./src/assets/contentVideos/vid9.mp4", "./src/assets/contentVideos/vid10.mp4"
        ];

        const imageList = [
            "../src/assets/imageevent/event5/exc2501.webp", "../src/assets/imageevent/event5/exc2502.webp", 
            "../src/assets/imageevent/event5/exc2503.webp", "../src/assets/imageevent/event5/exc2504.webp",
            "../src/assets/imageevent/event5/exc2505.webp", "../src/assets/imageevent/event5/exc2506.webp",
            "../src/assets/imageevent/event5/exc2507.webp", "../src/assets/imageevent/event5/exc2508.webp",
            "../src/assets/imageevent/event5/exc2509.webp", "../src/assets/imageevent/event5/exc2510.webp",
            "../src/assets/imageevent/event5/exc2511.webp", "../src/assets/imageevent/event5/exc2512.webp",
            "../src/assets/imageevent/event5/exc2513.webp", "../src/assets/imageevent/event5/exc2514.webp",
            "../src/assets/imageevent/event5/exc2515.webp", "../src/assets/imageevent/event5/exc2516.webp",
            "../src/assets/imageevent/event5/exc2517.webp", "../src/assets/imageevent/event5/exc2518.webp",
            "../src/assets/imageevent/event5/exc2519.webp", "../src/assets/imageevent/event5/exc2520.webp",
            "../src/assets/imageevent/event5/exc2521.webp", "../src/assets/imageevent/event5/exc2522.webp",
            "../src/assets/imageevent/event5/exc2523.webp", "../src/assets/imageevent/event5/exc2524.webp"
        ];

        function createBricks() {
            videoList.forEach((src, i) => createBrick(src, true, i));
            imageList.forEach((src, i) => createBrick(src, false, i + 10));
        }

        function createBrick(src, isVideo, index) {
            const brick = document.createElement('div');
            brick.className = 'photo-brick';
            
            if (isVideo) {
                const video = document.createElement('video');
                video.src = src;
                video.muted = true;
                video.loop = true;
                video.autoplay = true;
                
                video.onerror = function() {
                    console.error('Failed to load video:', src);
                    brick.style.background = '#ff6b6b';
                    brick.innerHTML = `<div style="color:white; padding:20px; text-align:center;">Video not found:<br>${src}</div>`;
                };
                
                brick.appendChild(video);
            } else {
                const img = document.createElement('img');
                img.src = src;
                img.onerror = function() {
                    console.error('Failed to load image:', src);
                };
                brick.appendChild(img);
            }
            
            setRandomPos(brick, index);
            addInteractions(brick);
            table.appendChild(brick);
        }

        function setRandomPos(brick, z) {
            const isMobile = window.innerWidth < 600;
            const brickWidth = isMobile ? 140 : 250;
            const brickHeight = isMobile ? 160 : 300;

            const maxX = window.innerWidth - brickWidth;
            const maxY = window.innerHeight - brickHeight;

            brick.style.left = Math.random() * maxX + 'px';
            brick.style.top = Math.random() * maxY + 'px';
            brick.style.transform = `rotate(${Math.random() * 30 - 15}deg)`;
            brick.style.zIndex = z;
        }

        function addInteractions(brick) {
            let isDragging = false;
            let startX, startY;

            brick.addEventListener('pointerdown', (e) => {
                isDragging = false;
                startX = e.clientX - brick.offsetLeft;
                startY = e.clientY - brick.offsetTop;
                brick.style.zIndex = ++highestZ;
                
                const onMove = (m) => {
                    isDragging = true;
                    brick.style.left = (m.clientX - startX) + 'px';
                    brick.style.top = (m.clientY - startY) + 'px';
                };

                document.addEventListener('pointermove', onMove);
                document.addEventListener('pointerup', () => {
                    document.removeEventListener('pointermove', onMove);
                }, { once: true });
            });

            brick.addEventListener('click', () => {
                if (!isDragging) {
                    const video = brick.querySelector('video');
                    
                    if (brick.classList.contains('active')) {
                        brick.classList.remove('active');
                        if (video) {
                            video.muted = true;
                        }
                    } else {
                        document.querySelectorAll('.active').forEach(a => {
                            a.classList.remove('active');
                            const otherVideo = a.querySelector('video');
                            if (otherVideo) {
                                otherVideo.muted = true;
                            }
                        });
                        
                        brick.classList.add('active');
                        if (video) {
                            video.muted = false;
                            video.play();
                        }
                    }
                }
            });
        }

        function shuffleWall() {
            document.querySelectorAll('.photo-brick').forEach((b, i) => {
                b.classList.remove('active');
                const video = b.querySelector('video');
                if (video) {
                    video.muted = true;
                }
                setRandomPos(b, i);
            });
        }

        window.addEventListener('resize', shuffleWall);
        createBricks();
    </script>
</div>
