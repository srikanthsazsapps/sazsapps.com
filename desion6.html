<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clear Spaced Floating Images</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #0a0a0a; 
        }

        .container {
            position: relative;
            width: 100%;
            height: 100vh;
        }

        .floating-img {
            position: absolute;
            bottom: -350px; 
            border-radius: 50%; 
            object-fit: cover;  
            border: 2px solid rgba(255, 255, 255, 0.8); 
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
            opacity: 0;
            filter: blur(0px); 
            animation: floatMove var(--speed) infinite linear;
            transition: transform 0.3s ease-out, box-shadow 0.3s;
            -webkit-tap-highlight-color: transparent;
        }

        .floating-img:active, .floating-img:hover {
            transform: scale(1.1) translateY(-20px) !important;
            z-index: 1000 !important;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.9);
            opacity: 1 !important;
        }

        @keyframes floatMove {
            0% { transform: translateY(0) translateX(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-150vh) translateX(var(--sway)); opacity: 0; }
        }

        @media (max-width: 600px) {
            .floating-img { bottom: -200px; }
        }
    </style>
</head>
<body>

    <div class="container" id="image-box"></div>

    <script>
        const container = document.getElementById('image-box');
        const isMobile = window.innerWidth < 600;

        const myImages = [
            "./src/assets/contentImages/whyimg2.webp", "./src/assets/contentImages/whyimg2.webp", 
            "./src/assets/contentImages/whyimg2.webp", "./src/assets/contentImages/sazsLogo1.png",
            "./src/assets/contentImages/img5.jpg", "./src/assets/contentImages/img6.jpg",
            "./src/assets/contentImages/img7.jpg", "./src/assets/contentImages/img8.jpg",
            "./src/assets/contentImages/img9.jpg", "./src/assets/contentImages/img10.jpg",
            "./src/assets/contentImages/img11.jpg", "./src/assets/contentImages/img12.jpg",
            "./src/assets/contentImages/img13.jpg", "./src/assets/contentImages/img14.jpg",
            "./src/assets/contentImages/img15.jpg", "./src/assets/contentImages/img16.jpg",
            "./src/assets/contentImages/img17.jpg", "./src/assets/contentImages/img18.jpg",
            "./src/assets/contentImages/img19.jpg", "./src/assets/contentImages/img20.jpg"
        ];

        // NEW: Column-based spacing logic
        const totalImages = myImages.length;
        const columnWidth = 100 / totalImages; // Divide screen into 20 zones

        myImages.forEach((imagePath, index) => {
            const img = document.createElement('img');
            img.src = imagePath; 
            img.className = 'floating-img';

            const speed = Math.random() * 10 + 15; 
            const minSize = isMobile ? 60 : 100;
            const maxSize = isMobile ? 80 : 130;
            const size = minSize + (Math.random() * maxSize); 

            // CALCULATE POSITION: Put each image in its own column zone
            // Zone start + a small random offset inside that zone
            const zoneStart = index * columnWidth;
            const offset = (Math.random() * (columnWidth - 5)); // Keep small gap
            const finalLeft = zoneStart + offset;

            const swayValue = isMobile ? (Math.random() * 30 - 15) : (Math.random() * 80 - 40);
            const delay = Math.random() * 25; // Keep long delay so they don't all rise together

            img.style.left = finalLeft + '%';
            img.style.width = size + 'px';
            img.style.height = size + 'px'; 
            img.style.setProperty('--speed', speed + 's');
            img.style.setProperty('--sway', swayValue + 'px');
            img.style.animationDelay = delay + 's';

            img.onerror = function() {
                this.src = "https://via.placeholder.com/150?text=Error";
            };

            container.appendChild(img);
        });
    </script>
</body>
</html>
